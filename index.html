<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>老师，谢谢你</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Ma+Shan+Zheng&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">

    <style>
        :root {
            --black: #000000;
            --light: #d1eeea;
            --primary: #0cf296;
        }

        /* 页面基础设置 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            background: var(--light);
            color: var(--black);

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
            user-select: none;
        }

        /* 标题 */
        .title {
            font-family: "Ma Shan Zheng", "PingFang SC", Arial, sans-serif;
            font-size: clamp(48px, 10vw, 100px);
            font-weight: bold;
            text-align: center;
        }

        /* 正文 */
        .body {
            font-family: "Zhi Mang Xing", "PingFang SC", Arial, sans-serif;
            font-size: clamp(22px, 4vw, 30px);
            font-weight: bold;
            text-align: center;
            line-height: 1.8;
        }

        /* 副标题 */
        .body2 {
            font-family: "Zhi Mang Xing", "PingFang SC", Arial, sans-serif;
            font-size: 25px;
            font-weight: bold;
            text-align: center;
        }

        /* 主卡片 */
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);

            max-width: 900px;
            width: 100%;
        }

        /* 学生留言区域：保留旧版样式 */
        .students {
            margin-top: 25px;
            padding: 20px;
            background: #f0faf7;
            border-radius: 12px;
            text-align: center;
            font-family: "Zhi Mang Xing", sans-serif;
            font-size: 22px;
        }

        /* 新增：输入区域 */
        .message-form {
            margin-top: 20px;
        }

        .message-form input,
        .message-form textarea {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 12px;

            border: 1px solid #c9ded8;
            border-radius: 10px;

            background: white;
            color: black;

            font-family: "Zhi Mang Xing", sans-serif;
            font-size: 22px;

            user-select: text;
        }

        .message-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .message-form button,
        .refresh-button {
            padding: 10px 25px;
            border: none;
            border-radius: 10px;

            background: #bce9d9;
            color: black;

            font-family: "Zhi Mang Xing", sans-serif;
            font-size: 22px;

            cursor: pointer;
        }

        .message-form button:hover,
        .refresh-button:hover {
            background: #a4dfca;
        }

        .message-form button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 新增：留言列表 */
        .message-list {
            margin-top: 25px;
            text-align: left;
        }

        .message-card {
            padding: 15px;
            margin: 12px 0;
            background: white;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .message-name {
            font-size: 23px;
            font-weight: bold;
        }

        .message-content {
            margin-top: 6px;
            font-size: 22px;
            white-space: pre-wrap;
        }

        .message-date {
            margin-top: 8px;
            font-size: 15px;
            color: #777;
            text-align: right;
        }

        .status {
            margin-top: 12px;
            font-size: 20px;
            overflow-wrap: anywhere;
        }

        /* 手机适配 */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .body2 {
                font-size: 22px;
            }
        }

    </style>
</head>

<body>

    <div class="table-wrapper">

        <div class="container">

            <div class="title">
                老师，谢谢你
            </div>

            <p class="body">
                感谢您在我们学习道路上的辛勤付出和耐心指导。
                您的教诲不仅让我们掌握了知识，
                更让我们懂得了做人做事的道理。
                祝您身体健康，工作顺利，生活幸福！
            </p>

            <p class="body2">
                这是来自各位学生的感谢：
            </p>

            <div class="students">

                感谢每一位老师的辛勤付出！❤️

                <!-- 留言输入 -->
                <form class="message-form" id="messageForm">

                    <input
                        type="text"
                        id="studentName"
                        maxlength="30"
                        placeholder="请输入你的姓名"
                        required
                    >

                    <textarea
                        id="studentMessage"
                        maxlength="500"
                        placeholder="写下你想对老师说的话……"
                        required
                    ></textarea>

                    <button type="submit" id="submitButton">
                        提交感谢
                    </button>

                </form>

                <div class="status" id="status" role="status" aria-live="polite"></div>

                <!-- 留言展示 -->
                <div class="message-list" id="messageList">
                    正在加载大家的感谢……
                </div>

                <button class="refresh-button" id="refreshButton" type="button">
                    刷新留言
                </button>

            </div>

        </div>
<p>有问题请联络yifeng14919@gmail.com</p>
<p>由Soh_192014制作</p>
    </div>

<script>
"use strict";

/* =====================================
   Supabase Configuration
===================================== */

const CONFIG = {
    SUPABASE_URL: "https://oicbculzzyydkueryrcj.supabase.co",
    SUPABASE_KEY: "sb_publishable_pIi99Qo0hqnV8_hOJ62vSQ_dMFeK9rB",
    FUNCTION_NAME: "swift-service"
};

const API_URL =
    CONFIG.SUPABASE_URL.replace(/\/+$/, "") +
    "/functions/v1/" +
    CONFIG.FUNCTION_NAME;

/* =====================================
   DOM
===================================== */

const form = document.getElementById("messageForm");
const nameInput = document.getElementById("studentName");
const messageInput = document.getElementById("studentMessage");
const submitButton = document.getElementById("submitButton");
const refreshButton = document.getElementById("refreshButton");
const statusBox = document.getElementById("status");
const messageList = document.getElementById("messageList");

/* =====================================
   Configuration Check
===================================== */

function isConfigured() {
    return (
        CONFIG.SUPABASE_URL.startsWith("https://") &&
        CONFIG.SUPABASE_URL.includes(".supabase.co") &&
        CONFIG.SUPABASE_KEY !== "YOUR_PUBLISHABLE_KEY" &&
        CONFIG.SUPABASE_KEY.trim() !== ""
    );
}

/* =====================================
   Status
===================================== */

function setStatus(message) {
    statusBox.textContent = message;
}

/* =====================================
   API Request
===================================== */

async function apiRequest(method, body = null) {

    if (!isConfigured()) {
        throw new Error(
            "请先填写 Supabase Project URL 和 Publishable Key。"
        );
    }

    const options = {
        method: method,
        headers: {
            "Content-Type": "application/json",
            "apikey": CONFIG.SUPABASE_KEY
        }
    };

    if (body !== null) {
        options.body = JSON.stringify(body);
    }

    const response = await fetch(API_URL, options);

    let data;

    try {
        data = await response.json();
    } catch {
        throw new Error("服务器返回的数据无法读取。");
    }

    if (!response.ok) {
        throw new Error(
            data.error || `服务器错误：HTTP ${response.status}`
        );
    }

    return data;
}

/* =====================================
   Load Messages
===================================== */

let isLoading = false;

async function loadMessages() {

    if (isLoading) return;

    isLoading = true;

    try {

        const data = await apiRequest("GET");

        if (!Array.isArray(data.messages)) {
            throw new Error("留言数据格式不正确。");
        }

        messageList.replaceChildren();

        if (data.messages.length === 0) {

            messageList.textContent =
                "还没有留言，成为第一个留下感谢的人吧！❤️";

            return;
        }

        for (const item of data.messages) {

            const card = document.createElement("div");
            card.className = "message-card";

            const name = document.createElement("div");
            name.className = "message-name";
            name.textContent = item.student_name || "匿名学生";

            const content = document.createElement("div");
            content.className = "message-content";
            content.textContent = item.message || "";

            const date = document.createElement("div");
            date.className = "message-date";

            const parsedDate = new Date(item.created_at);

            date.textContent =
                Number.isNaN(parsedDate.getTime())
                    ? ""
                    : parsedDate.toLocaleString("zh-CN");

            card.append(name, content, date);
            messageList.appendChild(card);
        }

    } catch (error) {

        messageList.textContent = "暂时无法加载留言。";
        setStatus(error.message);

    } finally {

        isLoading = false;
    }
}

/* =====================================
   Submit Message
===================================== */

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    const name = nameInput.value.trim();
    const message = messageInput.value.trim();

    if (!name || !message) {
        setStatus("请填写姓名和留言。");
        return;
    }

    if (name.length > 30 || message.length > 500) {
        setStatus("姓名最多30字，留言最多500字。");
        return;
    }

    submitButton.disabled = true;
    setStatus("正在提交你的感谢……");

    try {

        const data = await apiRequest("POST", {
            name,
            message
        });

        if (!data.success) {

            if (data.status === "block") {
                throw new Error(
                    data.error || "留言包含不适当的词语，请修改后再试。"
                );
            }

            if (data.status === "review") {
                throw new Error(
                    data.error || "留言需要进一步检查，请修改后再试。"
                );
            }

            throw new Error(data.error || "留言提交失败。");
        }

        form.reset();
        setStatus("感谢已经成功送达！❤️");

        await loadMessages();

    } catch (error) {

        setStatus(error.message);

    } finally {

        submitButton.disabled = false;
    }

});

/* =====================================
   Refresh
===================================== */

refreshButton.addEventListener("click", loadMessages);

/* 每30秒自动刷新 */
setInterval(loadMessages, 30000);

/* 初始加载 */
loadMessages();

</script>

</body>
</html>
